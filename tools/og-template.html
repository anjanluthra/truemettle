<!doctype html>
<!-- Source for public/opengraph-image.jpg and public/twitter-image.jpg, the
     link-preview card. MUSED's True Mettle rules: Light Auburn ground, the
     official wordmark (tools/brand/tm-wordmark-cream-white.svg, from the
     design system's Logos group, never retyped) in Cream White, centred, no
     other text. 520px wide keeps the 0.5x clear space even in a square crop.
     Regenerate with `npm run images` after editing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #A6472E; }
  body { display: flex; align-items: center; justify-content: center; }
  img { display: block; width: 520px; height: auto; }
</style>
</head>
<body>
  <img src="brand/tm-wordmark-cream-white.svg" alt="">
</body>
</html>
